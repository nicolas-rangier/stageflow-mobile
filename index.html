<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StageFlow Mobile — Prototype 1 PWA</title><meta name="theme-color" content="#1a2430"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="StageFlow"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{color-scheme:dark;--bg:#151b24;--panel:#25303e;--panel2:#303d4d;--text:#f5f6f8;--muted:#acb9c9;--gold:#e8b85d;--line:#405062}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:2;background:#1a2430;padding:18px 18px 14px;border-bottom:1px solid var(--line)}header small{color:var(--gold);font-weight:800;letter-spacing:2px}header h1{font-size:21px;margin:4px 0 0}main{max-width:640px;margin:auto;padding:18px 16px 110px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px}.muted{color:var(--muted)}.tiny{font-size:12px}.gold{color:var(--gold)}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.metric strong{display:block;font-size:28px}.metric span{font-size:12px;color:var(--muted)}.action,.item{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:14px;text-align:left;margin:6px 0}.action:focus-visible,.item:focus-visible,nav button:focus-visible{outline:3px solid var(--gold)}.item strong{display:block}.item small{color:var(--muted)}.pill{display:inline-block;border:1px solid #746239;background:#493c28;color:#f6d995;border-radius:30px;font-size:11px;padding:3px 9px}.search{width:100%;padding:14px;border:1px solid #647487;background:#202a37;color:white;border-radius:12px;margin-bottom:12px}details{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin:10px 0;overflow:hidden}summary{padding:15px;cursor:pointer;font-weight:700;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:'⌄';float:right;color:var(--gold)}details[open] summary:after{content:'⌃'}.rows{padding:0 15px 13px}.kv{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding:10px 0;font-size:13px}.kv span{color:var(--muted)}.kv b{text-align:right;overflow-wrap:anywhere}.back{border:0;background:transparent;color:var(--gold);padding:0 0 12px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#1a2430;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:4}nav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;font-size:11px}nav button.active{color:var(--gold);font-weight:800}nav button span{display:block;font-size:20px}#demo{background:#48391f;border:1px solid #8a6b36;color:#ffe6af;padding:10px 13px;border-radius:10px;margin-bottom:15px;font-size:12px}.empty{padding:25px 10px;text-align:center;color:var(--muted)}
</style></head><body><header><small>STAGEFLOW MOBILE</small><h1 id="heading">Mon parc technique</h1></header><main><div id="demo">PROTOTYPE 1 · Données fictives uniquement · Lecture seule · Aucun lien avec StageFlow PC</div><div id="content"></div></main><nav aria-label="Navigation principale"><button data-page="home" class="active"><span>⌂</span>Accueil</button><button data-page="equipment"><span>▣</span>Matériel</button><button data-page="events"><span>▤</span>Prestations</button><button data-page="search"><span>⌕</span>Recherche</button></nav><script>
'use strict';
const equipment=[{ref:'MAT-0012',name:'Lyre Spot LED 150 W',type:'Appareil',category:'Lyre asservie',state:'Disponible',location:'Stock A',technical:{Puissance:'150 W',Protocole:'DMX 512',Canaux:'16 / 20',Alimentation:'230 V'},maintenance:{État:'Opérationnel', 'Dernier contrôle':'Exemple fictif'},docs:['Notice technique — démonstration (non jointe)'],events:['PREST-001']},{ref:'MAT-0013',name:'PAR LED RGBW',type:'Appareil',category:'Projecteur LED',state:'Réservé',location:'Stock B',technical:{Source:'RGBW',Protocole:'DMX 512',Canaux:'8'},maintenance:{État:'Opérationnel'},docs:[],events:['PREST-001']},{ref:'ACC-0001',name:'Câble DMX 5 m',type:'Accessoire',category:'Câblage',state:'Disponible',location:'Stock A',technical:{Longueur:'5 m',Connectique:'XLR 3 points',Quantité:'8'},maintenance:{État:'Contrôlé'},docs:[],events:[]}];
const events=[{ref:'PREST-001',name:'Spectacle de magie — démonstration',date:'2026-12-12',place:'Salle de spectacle (fictive)',status:'Préparation',refs:['MAT-0012','MAT-0013'],notes:'Données fictives pour tester la consultation mobile.'},{ref:'PREST-002',name:'Soirée privée — démonstration',date:'2027-01-15',place:'Lieu fictif',status:'Planifiée',refs:[],notes:'Aucun matériel réservé dans cet exemple.'}];
let page='home',selection=null,query='';const content=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nice=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
function row(k,v){return `<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`}function section(name,rows,open=false){return `<details ${open?'open':''}><summary>${esc(name)}</summary><div class="rows">${rows||'<p class="muted tiny">Aucune information dans cet exemple.</p>'}</div></details>`}function go(p,id=null){page=p;selection=id;render();window.scrollTo(0,0)}
function equipmentList(items){return items.length?items.map(x=>`<button class="item" data-equip="${esc(x.ref)}"><strong>${esc(x.name)}</strong><small>${esc(x.ref)} · ${esc(x.category)} · ${esc(x.state)}</small></button>`).join(''):'<div class="empty">Aucun résultat.</div>'}function eventList(items){return items.length?items.map(x=>`<button class="item" data-event="${esc(x.ref)}"><strong>${esc(x.name)}</strong><small>${nice(x.date)} · ${esc(x.place)}</small></button>`).join(''):'<div class="empty">Aucune prestation.</div>'}
function render(){let html='';document.getElementById('heading').textContent=selection?'Fiche de consultation':({home:'Mon parc technique',equipment:'Matériel',events:'Prestations',search:'Recherche'}[page]);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(selection){const e=equipment.find(x=>x.ref===selection);const p=events.find(x=>x.ref===selection);html=`<button class="back" data-back="${e?'equipment':'events'}">← Retour à la liste</button>`;if(e){html+=`<div class="panel"><div class="tiny gold">${esc(e.type.toUpperCase())} · ${esc(e.ref)}</div><h2>${esc(e.name)}</h2><span class="pill">${esc(e.state)}</span></div>`;html+=section('Identification',[['Référence',e.ref],['Catégorie',e.category],['Emplacement',e.location],['État',e.state]].map(a=>row(...a)).join(''),true);html+=section('Caractéristiques techniques',Object.entries(e.technical).map(a=>row(...a)).join(''));html+=section('État et maintenance',Object.entries(e.maintenance).map(a=>row(...a)).join(''));html+=section('Prestations associées',e.events.map(ref=>{let x=events.find(p=>p.ref===ref);return x?`<button class="item" data-event="${esc(ref)}">${esc(x.name)}<br><small>${nice(x.date)}</small></button>`:''}).join(''));html+=section('Documents techniques',e.docs.map(x=>`<p class="tiny">${esc(x)}</p>`).join('')||'<p class="tiny muted">Aucun document dans cet exemple.</p>')}else if(p){html+=`<div class="panel"><div class="tiny gold">${esc(p.ref)}</div><h2>${esc(p.name)}</h2><span class="pill">${esc(p.status)}</span></div>`;html+=section('Informations générales',[['Date',nice(p.date)],['Lieu',p.place],['Statut',p.status]].map(a=>row(...a)).join(''),true);html+=section('Matériel réservé',p.refs.map(ref=>{let x=equipment.find(e=>e.ref===ref);return x?`<button class="item" data-equip="${esc(ref)}">${esc(x.name)}<br><small>${esc(ref)}</small></button>`:''}).join(''));html+=section('Notes',`<p>${esc(p.notes)}</p>`)}else{selection=null;html='<div class="empty">Fiche introuvable.</div>'}}
else if(page==='home'){html=`<div class="panel"><h2>Bienvenue sur StageFlow Mobile</h2><p class="muted tiny">Maquette de consultation hors ligne. Les données présentées ne proviennent pas de ton inventaire.</p></div><div class="grid"><div class="metric"><strong>${equipment.filter(e=>e.type==='Appareil').length}</strong><span>Appareils</span></div><div class="metric"><strong>${equipment.filter(e=>e.type==='Accessoire').length}</strong><span>Références accessoires</span></div><div class="metric"><strong>${events.length}</strong><span>Prestations</span></div><div class="metric"><strong>0</strong><span>Documents importés</span></div></div><h2 style="margin-top:22px">Accès rapides</h2><button class="action" data-page="equipment">▣ Consulter le matériel</button><button class="action" data-page="events">▤ Voir les prestations</button><button class="action" data-page="search">⌕ Rechercher une référence MAT / ACC</button><div class="panel" style="margin-top:18px"><b>Dernière actualisation</b><p class="muted tiny">Aucun import réel — Prototype 1</p></div>`}
else if(page==='equipment'){html='<p class="muted tiny">Appareils et accessoires · Données de démonstration</p>'+equipmentList(equipment)}else if(page==='events'){html='<p class="muted tiny">Planning de démonstration</p>'+eventList(events)}else if(page==='search'){const term=query.trim().toLowerCase();const filtered=equipment.filter(x=>(x.ref+' '+x.name+' '+x.category+' '+x.location).toLowerCase().includes(term));html=`<label for="q" class="tiny gold">Nom, référence MAT / ACC ou catégorie</label><input id="q" class="search" type="search" autocomplete="off" placeholder="Ex. MAT-0012 ou lyre" value="${esc(query)}"><div id="results">${equipmentList(filtered)}</div>`}content.innerHTML=html;
content.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>go('equipment',b.dataset.equip));content.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>go('events',b.dataset.event));content.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));content.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go(b.dataset.back));const input=document.getElementById('q');if(input)input.addEventListener('input',()=>{query=input.value;document.getElementById('results').innerHTML=equipmentList(equipment.filter(x=>(x.ref+' '+x.name+' '+x.category+' '+x.location).toLowerCase().includes(query.trim().toLowerCase())));document.querySelectorAll('#results [data-equip]').forEach(b=>b.onclick=()=>go('equipment',b.dataset.equip))})}
document.querySelectorAll('nav [data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script><script>if ('serviceWorker' in navigator && location.protocol === 'https:') {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Mode hors ligne indisponible',err)));}</script></body></html>
