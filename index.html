<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StageFlow Mobile V3.2.2 — Fiches prestations</title><meta name="theme-color" content="#1a2430"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="StageFlow"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{color-scheme:dark;--bg:#151b24;--panel:#25303e;--panel2:#303d4d;--text:#f5f6f8;--muted:#acb9c9;--gold:#e8b85d;--line:#405062}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:2;background:#1a2430;padding:calc(18px + env(safe-area-inset-top, 0px)) 18px 14px;border-bottom:1px solid var(--line)}header small{color:var(--gold);font-weight:800;letter-spacing:2px}header h1{font-size:21px;margin:4px 0 0}main{max-width:640px;margin:auto;padding:18px 16px 110px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px}.muted{color:var(--muted)}.tiny{font-size:12px}.gold{color:var(--gold)}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.metric strong{display:block;font-size:28px}.metric span{font-size:12px;color:var(--muted)}.action,.item{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:14px;text-align:left;margin:6px 0}.action:focus-visible,.item:focus-visible,nav button:focus-visible{outline:3px solid var(--gold)}.item strong{display:block}.item small{color:var(--muted)}.pill{display:inline-block;border:1px solid #746239;background:#493c28;color:#f6d995;border-radius:30px;font-size:11px;padding:3px 9px}.search{width:100%;padding:14px;border:1px solid #647487;background:#202a37;color:white;border-radius:12px;margin-bottom:12px}details{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin:10px 0;overflow:hidden}summary{padding:15px;cursor:pointer;font-weight:700;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:'⌄';float:right;color:var(--gold)}details[open] summary:after{content:'⌃'}.rows{padding:0 15px 13px}.kv{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding:10px 0;font-size:13px}.kv span{color:var(--muted)}.kv b{text-align:right;overflow-wrap:anywhere}.back{border:0;background:transparent;color:var(--gold);padding:0 0 12px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);background:#1a2430;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:4}nav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;font-size:11px}nav button.active{color:var(--gold);font-weight:800}nav button span{display:block;font-size:20px}#demo{background:#48391f;border:1px solid #8a6b36;color:#ffe6af;padding:10px 13px;border-radius:10px;margin-bottom:15px;font-size:12px}.empty{padding:25px 10px;text-align:center;color:var(--muted)}
 .photo{max-width:100%;max-height:260px;object-fit:contain;border-radius:10px;margin-top:8px}.status{font-size:12px;color:var(--gold)}.danger{border-color:#a86767}.wide{width:100%}.reservation{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 0}.reservation>div{min-width:0}.mini{flex-shrink:0;border:1px solid var(--gold);border-radius:9px;color:var(--gold);background:transparent;padding:8px;font-size:12px}nav button{font-size:10px}nav button span{font-size:19px}.plan-preview{width:100%;max-height:350px;object-fit:contain;background:#f1f1f1;border-radius:10px;margin:10px 0}.plan-button{width:100%;padding:12px;background:#283b4a;color:var(--gold);border:1px solid var(--gold);border-radius:10px}.tech-note{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.plan-overlay{position:fixed;inset:0;background:#101720;z-index:30;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}.plan-overlay[hidden]{display:none}.plan-overlay .plan-top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff}.plan-overlay .plan-top button{border:1px solid #aeb8c7;background:#273747;color:white;border-radius:8px;padding:10px 14px}.plan-overlay img{width:100%;height:100%;min-height:0;object-fit:contain;touch-action:pinch-zoom}.plan-overlay .plan-frame{flex:1;min-height:0;overflow:auto}  .scan-video{width:100%;max-height:340px;background:#080c12;border:1px solid var(--line);border-radius:12px;object-fit:cover}.scan-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.scan-actions button{padding:12px 8px;background:#303d4d;border:1px solid #68778a;border-radius:10px;color:white}.scan-message{padding:12px;border:1px solid var(--line);border-radius:9px;margin:12px 0;white-space:pre-wrap}.scan-input{width:100%;padding:13px;border:1px solid #647487;border-radius:9px;background:#202a37;color:white;margin:8px 0}.scan-photo{width:100%;margin:10px 0}.scan-hint{font-size:12px;color:var(--muted)} </style><style id="stageflow-mobile-v3-2-1-thumbnails">.item-with-thumb{display:flex!important;align-items:center;gap:12px;text-align:left;min-height:76px}.item-thumb{display:block;width:58px;height:58px;min-width:58px;flex:0 0 58px;object-fit:cover;border-radius:9px;background:#17212c;border:1px solid var(--line)}.item-thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:24px;opacity:.7}.item-copy{display:block;min-width:0;flex:1;overflow-wrap:anywhere}.item-copy strong,.item-copy small{display:block}</style><style id="stageflow-mobile-v3-2-2-prestations">
.event-hero{background:linear-gradient(145deg,#303d4d,#202c3a);border:1px solid #58616d;border-radius:15px;padding:17px;margin:12px 0}.event-hero h2{font-size:21px;line-height:1.2;margin:7px 0 12px}.event-eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}.event-meta{display:grid;gap:7px;margin-top:14px}.event-meta div{font-size:13px;color:#dce5ed}.event-meta span{color:#aebdca;display:inline-block;min-width:65px}.event-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.event-kpi{background:#283443;border:1px solid var(--line);border-radius:11px;padding:12px}.event-kpi b{font-size:22px;color:#fff;display:block}.event-kpi span{font-size:11px;color:#bac6d4}.event-progress{height:7px;border-radius:10px;background:#17212b;overflow:hidden;margin-top:9px}.event-progress i{display:block;height:100%;background:var(--gold)}.event-task{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.event-task-mark{width:19px;height:19px;flex:0 0 19px;border:1px solid #8390a0;border-radius:5px;text-align:center;line-height:17px;color:var(--gold)}.event-task-mark.done{border-color:var(--gold);background:#493d2b}.event-top{padding:11px 0;border-top:1px solid var(--line)}.event-top strong{color:#fff}.event-top .muted{display:block;margin-top:3px}.event-section-name{color:var(--gold);font-size:13px;margin:15px 0 6px}.event-section-name:first-child{margin-top:0}.event-blank{color:var(--muted);font-size:12px}.event-list-label{font-size:11px;color:var(--gold);letter-spacing:.6px;text-transform:uppercase}.event-note{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><header><small>STAGEFLOW MOBILE</small><h1 id="heading">Mon parc technique</h1></header><main><div id="demo">V3.2.2 · Import manuel JSON · Lecture seule · Données conservées localement</div><div id="content"></div></main><nav aria-label="Navigation principale"><button data-page="home" class="active"><span>⌂</span>Accueil</button><button data-page="equipment"><span>▣</span>Matériel</button><button data-page="accessories"><span>◇</span>Accessoires</button><button data-page="events"><span>▤</span>Prestations</button><button data-page="search"><span>⌕</span>Recherche</button><button data-page="import"><span>⇩</span>Import</button></nav><div id="planOverlay" class="plan-overlay" hidden role="dialog" aria-modal="true" aria-label="Plan de feu"><div class="plan-top"><strong id="planTitle">Plan de feu</strong><button type="button" id="closePlan">Fermer ✕</button></div><div class="plan-frame"><img id="planFull" alt="Plan technique de la prestation"></div></div><script src="./jsQR.js"></script><script>
'use strict';
const demoEquipment=[{ref:'MAT-0012',name:'Lyre Spot LED 150 W',category:'Lyre asservie',state:'Disponible',location:'Stock A',technical:{Puissance:'150 W',Protocole:'DMX 512'}},{ref:'ACC-0001',name:'Câble DMX 5 m',category:'Câblage',state:'Disponible',location:'Stock A',technical:{Longueur:'5 m'}}];
const demoEvents=[{name:'Spectacle de magie — démonstration',date:'2026-12-12',place:'Salle fictive'}];
let dataset=null, page='home',selection=null,query='',importError='';
const content=document.getElementById('content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=x=>x===null||x===undefined||x===''?'—':String(x);
const fmtDate=x=>{if(!x)return '—';let d=new Date(String(x).slice(0,10)+'T12:00:00');return Number.isNaN(d.getTime())?String(x):d.toLocaleDateString('fr-FR')};
const arr=x=>Array.isArray(x)?x:[];
function rows(a){return a.map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b>${esc(val(v))}</b></div>`).join('')}
function section(name,body,open=false){return `<details ${open?'open':''}><summary>${esc(name)}</summary><div class="rows">${body||'<p class="muted tiny">Aucune information enregistrée.</p>'}</div></details>`}
function records(){if(!dataset)return {equipment:demoEquipment,events:demoEvents};let equipment=[];for(const i of dataset.items){const cat=dataset.categories.find(c=>c.id===i.categoryId)?.name||'Matériel';const units=arr(i.units);if(units.length){for(const u of units)equipment.push({ref:u.code||'Sans référence',name:i.name,category:cat,state:u.status||u.condition||'',location:u.location||i.location||'',technical:{Marque:i.brand,Modèle:i.model,'Référence fabricant':i.reference,'Numéro de série':u.serial},item:i,unit:u,type:'mat'});}else equipment.push({ref:i.reference||'Sans référence',name:i.name,category:cat,state:'',location:i.location||'',technical:{Marque:i.brand,Modèle:i.model},item:i,type:'mat'});}for(const a of dataset.accessories)equipment.push({ref:a.code||'Sans référence',name:a.name,category:a.category||'Accessoire',state:'',location:'',technical:{'Quantité en stock':a.qty},accessory:a,type:'acc'});return {equipment,events:dataset.shows};}
function go(p,id=null){if(page==='scan')stopScan();page=p;selection=id;render();window.scrollTo(0,0)}
function itemThumbnail(x){const src=x.type==='acc'?x.accessory?.photo:arr(x.item?.photos).find(validImageData);return validImageData(src)?`<img class="item-thumb" src="${esc(src)}" alt="" loading="lazy" decoding="async">`:`<span class="item-thumb item-thumb-empty" aria-hidden="true">${x.type==='acc'?'◇':'▣'}</span>`}
function itemList(list){return list.length?list.map((x,i)=>`<button class="item item-with-thumb" data-item="${x.idx??i}">${itemThumbnail(x)}<span class="item-copy"><strong>${esc(x.name)}</strong><small>${esc(x.ref)} · ${esc(x.category)}</small></span></button>`).join(''):'<div class="empty">Aucun résultat.</div>'}
function eventList(list){return list.length?list.map((x,i)=>`<button class="item" data-event="${i}"><strong>${esc(x.name)}</strong><small>${esc(fmtDate(x.start||x.startDate||x.date))} · ${esc(x.place||'')}</small></button>`).join(''):'<div class="empty">Aucune prestation.</div>'}
function showItem(x){let html=`<button class="back" data-back="${x.type==='acc'?'accessories':'equipment'}">← Retour</button><div class="panel"><div class="tiny gold">${esc(x.ref)}</div><h2>${esc(x.name)}</h2><span class="pill">${esc(x.category)}</span></div>`;html+=section('Identification',rows([['Référence',x.ref],['Catégorie',x.category],['Emplacement',x.location],['État',x.state]]),true);html+=section('Caractéristiques',rows(Object.entries(x.technical).filter(([k,v])=>v!==undefined&&v!=='')));if(x.item){let i=x.item;html+=section('Fiche commune',rows([['Description',i.description],['Quantité totale',i.qty],['Date d’acquisition',i.date],['Fournisseur',i.supplier]]));if(arr(i.photos).length)html+=section('Photographies',arr(i.photos).map(src=>typeof src==='string'&&src.startsWith('data:image/')?`<img class="photo" alt="Photographie du matériel" src="${esc(src)}">`:'').join(''));if(x.unit){let u=x.unit;html+=section('Suivi individuel',rows([['Numéro de série',u.serial],['Ancienne référence',u.legacyCode],['Emplacement',u.location],['État',u.status||u.condition]]));}}if(x.accessory){html+=section('Accessoire',rows([['Quantité',x.accessory.qty],['Notes',x.accessory.notes]]));if(validImageData(x.accessory.photo))html+=section('Photographie de l’accessoire',`<img class="photo" alt="Photographie de l’accessoire" src="${esc(x.accessory.photo)}">`)}return html}
function validImageData(s){return typeof s==='string'&&/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=\s]+$/i.test(s)}
function technicalSection(x){const t=x.technical||{};const fields=[['Adresse et accès',t.address],['Contact technique',t.technicalContact],['Montage',t.setupTime],['Démontage',t.strikeTime],['Électricité',t.power],['Implantation et plateau',t.stage],['Sécurité et contraintes',t.safety],['Particularités',t.particularities]];const notes=fields.filter(([,v])=>v!==null&&v!==undefined&&String(v).trim()).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b style="white-space:pre-wrap">${esc(v)}</b></div>`).join('');const hasPlan=validImageData(t.planData);const plan=hasPlan?`<div><div class="tiny muted">${esc(t.planName||'Plan de feu / implantation')}</div><img class="plan-preview" alt="Aperçu du plan de feu" src="${t.planData}"><button type="button" class="plan-button" data-plan-open="1">⤢ Agrandir le plan</button><p class="muted tiny">Plan intégré à la sauvegarde JSON, consultable hors ligne.</p></div>`:`<p class="muted tiny">${t.planData?'Format du plan non pris en charge.':'Aucun plan joint à cette prestation.'}</p>`;return section('Fiche technique et plan de feu',notes+`<h3 style="margin-top:15px">Plan de feu / implantation</h3>`+plan,true)}
function openPlan(){if(!selection||selection.kind!=='event')return;const {events}=records();const t=events[selection.index]?.technical||{};if(!validImageData(t.planData))return;const overlay=document.getElementById('planOverlay');document.getElementById('planFull').src=t.planData;document.getElementById('planTitle').textContent=t.planName||'Plan de feu';overlay.hidden=false;document.body.style.overflow='hidden'}
function closePlan(){document.getElementById('planOverlay').hidden=true;document.getElementById('planFull').removeAttribute('src');document.body.style.overflow=''}
function eventStats(x){const units=arr(x.units),acc=arr(x.accessoryLines),all=[...units,...acc];return {units,acc,total:all.length,loaded:all.filter(v=>v.loaded).length,returned:all.filter(v=>v.returned).length}}
function eventChecklist(x){const tasks=arr(x.checklist);if(!tasks.length)return section('✓ Contrôles de préparation','<p class="event-blank">Aucune check-list enregistrée.</p>');const done=tasks.filter(t=>t.done).length;const groups=[];for(const t of tasks){const group=String(t.group||t.category||t.section||'Contrôles').trim();let g=groups.find(v=>v.name===group);if(!g){g={name:group,tasks:[]};groups.push(g)}g.tasks.push(t)}return section(`✓ Contrôles de préparation (${done}/${tasks.length})`,`<div class="event-progress"><i style="width:${Math.round(done/tasks.length*100)}%"></i></div>`+groups.map(g=>`<h3 class="event-section-name">${esc(g.name)}</h3>`+g.tasks.map(t=>`<div class="event-task"><span class="event-task-mark ${t.done?'done':''}" aria-hidden="true">${t.done?'✓':''}</span><span>${esc(t.text||t.label||t.name||'Tâche')}</span></div>`).join('')).join(''))}
function eventConduite(x){const d=x.sfConduite||{},sections=arr(d.sections),tops=arr(d.tops);if(!sections.length&&!tops.length)return '';const content=sections.map(sec=>`<h3 class="event-section-name">${esc(sec.name||'Section')}</h3>`+tops.filter(t=>t.sectionId===sec.id).map(t=>`<div class="event-top"><strong>TOP ${esc(t.number||'—')}${esc(t.suffix||t.intermediateSuffix||'')} — ${esc(t.name||'')}</strong>${t.trigger?`<span class="muted tiny">Déclencheur : ${esc(t.trigger)}</span>`:''}${arr(t.actions).map(a=>`<div class="tiny muted">${esc(a.domain||'Action')} : ${esc(a.description||a.text||a.name||'')}</div>`).join('')}</div>`).join('')).join('');return section(`🎛️ Conduite technique (${sections.length} sections · ${tops.length} tops)`,content||'<p class="event-blank">Aucun top enregistré.</p>')}
function showEvent(x){
 const st=eventStats(x),{equipment}=records();
 const pct=st.total?Math.round(st.loaded/st.total*100):0;
 const matRows=st.units.map(r=>{const idx=equipment.findIndex(e=>e.type==='mat'&&(e.unit?.id===r.unitId||(r.code&&e.ref===r.code)));const item=idx>=0?equipment[idx]:null;return `<div class="reservation"><div><strong>${esc(item?.name||r.name||'Appareil non retrouvé')}</strong><div class="tiny muted">${esc(item?.ref||r.code||'Sans référence')}</div><div class="tiny muted">Chargé : ${r.loaded?'Oui':'Non'} · Retourné : ${r.returned?'Oui':'Non'}</div></div>${idx>=0?`<button class="mini" data-linked-item="${idx}">Voir fiche</button>`:'<span class="tiny muted">Fiche indisponible</span>'}</div>`}).join('');
 const accRows=st.acc.map(l=>{const idx=equipment.findIndex(e=>e.type==='acc'&&e.accessory?.id===l.accessoryId),a=idx>=0?equipment[idx]:null;return `<div class="reservation"><div><strong>${esc(a?.name||l.name||'Accessoire non retrouvé')}</strong><div class="tiny muted">${esc(a?.ref||'Référence non disponible')} · Quantité : ${esc(l.qty??0)}</div><div class="tiny muted">Chargé : ${l.loaded?'Oui':'Non'} · Retourné : ${l.returned?'Oui':'Non'}</div></div>${idx>=0?`<button class="mini" data-linked-item="${idx}">Voir fiche</button>`:'<span class="tiny muted">Fiche indisponible</span>'}</div>`}).join('');
 const start=fmtDate(x.start||x.startDate||x.date),end=fmtDate(x.end||x.endDate);
 return `<button class="back" data-back="events">← Retour aux prestations</button><div class="event-hero"><div class="event-eyebrow">Fiche de prestation · Consultation</div><h2>${esc(x.name)}</h2><span class="pill">${esc(x.status||'Prestation')}</span><div class="event-meta"><div><span>Dates</span>${esc(start)}${end!=='—'&&end!==start?' → '+esc(end):''}</div><div><span>Lieu</span>${esc(x.place||'Non précisé')}</div>${x.callTime?`<div><span>RDV</span>${esc(x.callTime)}</div>`:''}</div></div>`+
 `<div class="event-kpis"><div class="event-kpi"><b>${st.units.length}</b><span>Appareils réservés</span></div><div class="event-kpi"><b>${st.acc.length}</b><span>Lignes accessoires</span></div><div class="event-kpi"><b>${st.loaded}/${st.total}</b><span>Lignes chargées</span></div><div class="event-kpi"><b>${st.returned}/${st.total}</b><span>Lignes retournées</span></div></div>`+
 section('Suivi opérationnel',`<div class="tiny muted">Chargement : ${pct}% · ${st.total-st.loaded} ligne(s) restant à charger</div><div class="event-progress"><i style="width:${pct}%"></i></div>`,true)+
 section('Informations générales',rows([['Début',start],['Fin',end],['Lieu',x.place],['Contact sur place',x.contact],['Heure de rendez-vous',x.callTime],['Observations',x.notes]]),true)+
 eventChecklist(x)+eventConduite(x)+
 section(`Appareils réservés (${st.units.length})`,matRows||'<p class="event-blank">Aucun appareil réservé.</p>')+
 section(`Accessoires réservés (${st.acc.length})`,accRows||'<p class="event-blank">Aucun accessoire réservé.</p>')+
 technicalSection(x)+
 (x.accessories?section('Consommables à prévoir',`<p class="event-note">${esc(x.accessories)}</p>`):'');
}
function render(){const {equipment,events}=records();let html='';document.getElementById('heading').textContent=selection?'Fiche de consultation':({home:'Mon parc technique',equipment:'Matériel',accessories:'Accessoires',events:'Prestations',search:'Recherche',scan:'Scanner QR',import:'Import des données'}[page]);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('demo').textContent=dataset?'DONNÉES IMPORTÉES · Lecture seule · Aucun transfert vers Internet':'MODE DÉMONSTRATION · Données fictives · Lecture seule';
if(selection){html=selection.kind==='item'?showItem(equipment[selection.index]):showEvent(events[selection.index]);}
else if(page==='home'){html=`<div class="panel"><h2>${dataset?'Inventaire importé':'Bienvenue sur StageFlow Mobile'}</h2><p class="muted tiny">${dataset?'Consultation locale, sans modification possible.':'Données fictives : importer une sauvegarde JSON pour consulter votre parc.'}</p></div><div class="grid"><div class="metric"><strong>${equipment.filter(x=>x.type!=='acc').length}</strong><span>Unités matériel</span></div><div class="metric"><strong>${equipment.filter(x=>x.type==='acc').length}</strong><span>Accessoires</span></div><div class="metric"><strong>${events.length}</strong><span>Prestations</span></div><div class="metric"><strong>${dataset?(arr(dataset.items).reduce((n,x)=>n+arr(x.photos).length,0)+arr(dataset.accessories).filter(x=>typeof x.photo==='string'&&x.photo.startsWith('data:image/')).length):0}</strong><span>Photos</span></div></div><h2 style="margin-top:22px">Accès rapides</h2><button class="action" data-page="import">⇩ Importer une sauvegarde StageFlow PC</button><button class="action" data-page="equipment">▣ Consulter le matériel</button><button class="action" data-page="accessories">◇ Consulter les accessoires</button><button class="action" data-page="events">▤ Voir les prestations</button><button class="action" data-page="scan">▦ Scanner une étiquette QR</button><div class="panel"><b>Dernière importation</b><p class="muted tiny">${dataset?esc(dataset.importedOn):'Aucune'}</p></div>`}
else if(page==='equipment'){html='<p class="muted tiny">Fiches consultables uniquement</p>'+itemList(equipment.map((x,i)=>({...x,idx:i})).filter(x=>x.type!=='acc'))}
else if(page==='accessories'){html='<p class="muted tiny">Accessoires · Fiches consultables uniquement</p>'+itemList(equipment.map((x,i)=>({...x,idx:i})).filter(x=>x.type==='acc'))}
else if(page==='events'){html='<p class="muted tiny">Prestations consultables uniquement</p>'+eventList(events)}
else if(page==='scan'){html=scanPage()}
else if(page==='search'){let filtered=equipment.map((x,i)=>({...x,idx:i})).filter(x=>(x.ref+' '+x.name+' '+x.category+' '+x.location).toLowerCase().includes(query.toLowerCase()));html=`<button class="action" data-page="scan">▦ Scanner une étiquette QR</button><label for="q" class="tiny gold">Référence MAT / ACC, nom ou catégorie</label><input id="q" class="search" type="search" placeholder="Ex. MAT-0012" value="${esc(query)}"><div id="results">${filtered.length?filtered.map(x=>`<button class="item" data-item="${x.idx}"><strong>${esc(x.name)}</strong><small>${esc(x.ref)}</small></button>`).join(''):'<div class="empty">Aucun résultat.</div>'}</div>`}
else if(page==='import'){html=`<div class="panel"><h2>Importer depuis StageFlow PC</h2><p class="muted">Sur le PC : <b>Sauvegardes → Télécharger une sauvegarde JSON</b>. Transfère ensuite ce fichier sur l’iPhone (AirDrop, Fichiers, etc.), puis sélectionne-le ici.</p><input id="jsonfile" type="file" accept=".json,application/json" style="width:100%;margin:12px 0"><p class="tiny muted">L’import remplace uniquement les données consultées sur cet iPhone. Il ne modifie jamais StageFlow PC et n’envoie rien à GitHub.</p>${dataset?`<p class="status">Dernier import : ${esc(dataset.importedOn)}</p><button class="action danger" id="clear">Effacer les données importées sur cet appareil</button>`:''}${importError?`<p class="status">${esc(importError)}</p>`:''}</div>`}
content.innerHTML=html;if(page==='scan'&&!selection)wireScan();content.querySelectorAll('[data-plan-open]').forEach(b=>b.onclick=openPlan);content.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>go('equipment',{kind:'item',index:Number(b.dataset.item)}));content.querySelectorAll('[data-linked-item]').forEach(b=>b.onclick=()=>go('equipment',{kind:'item',index:Number(b.dataset.linkedItem)}));content.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>go('events',{kind:'event',index:Number(b.dataset.event)}));content.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));content.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go(b.dataset.back));const inp=document.getElementById('q');if(inp)inp.oninput=()=>{query=inp.value;render();document.getElementById('q')?.focus();document.getElementById('q')?.setSelectionRange(query.length,query.length)};const file=document.getElementById('jsonfile');if(file)file.onchange=async()=>{if(file.files[0])await importFile(file.files[0])};const clear=document.getElementById('clear');if(clear)clear.onclick=async()=>{if(confirm('Effacer uniquement les données importées sur cet iPhone ?')){await dbPut(null);dataset=null;go('home')}};}
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open('StageFlowMobileReadOnly',1);r.onupgradeneeded=()=>r.result.createObjectStore('snapshots');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPut(value){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readwrite');tx.objectStore('snapshots').put(value,'current');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function dbGet(){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readonly');const r=tx.objectStore('snapshots').get('current');r.onsuccess=()=>{db.close();resolve(r.result)};r.onerror=()=>{db.close();reject(r.error)}})}
async function importFile(file){importError='';try{const data=JSON.parse(await file.text());if(data.application!=='Light Inventory'||data.formatVersion!==1||!Array.isArray(data.items)||!Array.isArray(data.categories)||!Array.isArray(data.shows)||!Array.isArray(data.accessories))throw Error('Fichier non reconnu : utilise une sauvegarde JSON complète de StageFlow PC.');if(!data.items.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string')||!data.accessories.every(x=>x&&typeof x.name==='string'))throw Error('Fichier incomplet ou invalide.');const snapshot={items:data.items,categories:data.categories,shows:data.shows,accessories:data.accessories,venues:arr(data.venues),importedOn:new Date().toLocaleString('fr-FR')};await dbPut(snapshot);dataset=snapshot;alert('Import terminé : '+data.items.length+' fiches matériel, '+data.accessories.length+' accessoires et '+data.shows.length+' prestations.');go('home')}catch(err){importError='Import impossible : '+err.message;render()}}
// Prototype 3B : QR locaux, sans dépendance externe ni écriture dans les données PC.
let scanStream=null,scanFrame=0,scanBusy=false,scanActive=false,scanLast=0;const scanCanvas=document.createElement("canvas");const scanCtx=scanCanvas.getContext("2d",{willReadFrequently:true});
function scanPage(){return `<div class="panel"><h2>Lecture d'une étiquette StageFlow</h2><p class="muted tiny">Scanne une étiquette MAT ou ACC créée sur StageFlow PC. La fiche doit être présente dans la dernière sauvegarde importée.</p><video id="scanVideo" class="scan-video" playsinline muted autoplay style="display:none"></video><div class="scan-actions"><button id="scanStart" type="button">📷 Activer la caméra</button><button id="scanStop" type="button">Arrêter</button></div><div id="scanMessage" class="scan-message" role="status">Caméra inactive.</div><label for="scanCode">Référence ou contenu du QR</label><input id="scanCode" class="scan-input" placeholder="MAT-0001 ou STAGEFLOW:ACC:ACC-0001" autocomplete="off" autocapitalize="characters"><button class="action" id="scanFind" type="button">Rechercher la fiche</button><label for="scanImage">Ou choisir une photo du QR code</label><input class="scan-photo" id="scanImage" type="file" accept="image/*"><p class="scan-hint">La caméra et la lecture des photos utilisent le décodeur jsQR intégré, sans BarcodeDetector. La saisie manuelle fonctionne même sans caméra et hors ligne. Aucune image n'est envoyée sur Internet.</p></div>`}
function scanMessage(t){const el=document.getElementById('scanMessage');if(el)el.textContent=t}
function stopScan(){scanActive=false;scanBusy=false;if(scanFrame){cancelAnimationFrame(scanFrame);scanFrame=0}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}const v=document.getElementById('scanVideo');if(v){v.pause();v.srcObject=null;v.style.display='none'}}
function resolveCode(raw){const token=String(raw||'').trim().toUpperCase();const encoded=/^STAGEFLOW:(MAT|ACC):([A-Z0-9_-]+)$/.exec(token);let code=token,kind=null;if(encoded){kind=encoded[1];code=encoded[2];if(!code.startsWith(kind+'-')){scanMessage('QR StageFlow incohérent.');return}}else if(token.startsWith('STAGEFLOW:')){scanMessage('Format QR StageFlow non reconnu.');return}else if(!/^(MAT|ACC)-[A-Z0-9_-]+$/.test(token)){scanMessage('Référence non reconnue. Exemple : MAT-0001 ou ACC-0001.');return}
const {equipment}=records();const found=equipment.map((x,index)=>({...x,index})).filter(x=>String(x.ref).toUpperCase()===code&&(!kind||(kind==='ACC'?x.type==='acc':x.type==='mat')));if(found.length===1){stopScan();go('equipment',{kind:'item',index:found[0].index})}else if(found.length>1){scanMessage('Plusieurs fiches portent cette référence dans la sauvegarde. Vérifie les données sur PC.')}else{scanMessage('Référence '+code+' absente de la sauvegarde importée. Vérifie que tu as importé une sauvegarde récente.')}}
function decodeScan(source,width,height){if(typeof jsQR!=="function")throw Error('Bibliothèque jsQR non chargée. Vérifie la présence de jsQR.js.');if(!scanCtx)throw Error('Canvas indisponible.');const max=960;const scale=Math.min(1,max/Math.max(width,height));scanCanvas.width=Math.max(1,Math.round(width*scale));scanCanvas.height=Math.max(1,Math.round(height*scale));scanCtx.drawImage(source,0,0,scanCanvas.width,scanCanvas.height);const pixels=scanCtx.getImageData(0,0,scanCanvas.width,scanCanvas.height);return jsQR(pixels.data,pixels.width,pixels.height,{inversionAttempts:'attemptBoth'});}
async function startScan(){stopScan();if(!dataset){scanMessage('Importe d’abord une sauvegarde JSON de StageFlow PC.');return}if(!window.isSecureContext){scanMessage('Caméra indisponible : ouvre StageFlow depuis son adresse HTTPS GitHub Pages.');return}if(!navigator.mediaDevices?.getUserMedia){scanMessage('Accès caméra indisponible dans cet environnement iPhone. Essaie depuis Safari ou utilise une photo.');return}if(typeof jsQR!=="function"){scanMessage('Décodeur QR non chargé. Vérifie le fichier jsQR.js sur GitHub.');return}try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=document.getElementById('scanVideo');if(!v){stopScan();return}v.srcObject=scanStream;v.style.display='block';await v.play();scanActive=true;scanMessage('Caméra active. Présente une étiquette StageFlow devant l’objectif.');scanFrame=requestAnimationFrame(scanLoop)}catch(e){stopScan();scanMessage('Impossible d’activer la caméra : '+(e.name==='NotAllowedError'?'autorisation refusée. Vérifie les autorisations caméra de Safari.':e.message))}}
function scanLoop(now){if(!scanActive)return;const v=document.getElementById('scanVideo');if(!v)return;if(!scanBusy&&v.readyState>=2&&v.videoWidth>0&&now-scanLast>250){scanBusy=true;scanLast=now;try{const result=decodeScan(v,v.videoWidth,v.videoHeight);if(result?.data){resolveCode(result.data);if(!scanActive)return}}catch(e){scanMessage('Lecture impossible : '+e.message);stopScan();return}finally{scanBusy=false}}if(scanActive)scanFrame=requestAnimationFrame(scanLoop)}
async function scanImage(file){if(!file)return;if(typeof jsQR!=="function"){scanMessage('Décodeur QR non chargé.');return}let url;try{url=URL.createObjectURL(file);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Image non reconnue'));img.src=url});const result=decodeScan(img,img.naturalWidth,img.naturalHeight);if(result?.data)resolveCode(result.data);else scanMessage('Aucun QR code détecté sur cette image. Essaie une photo nette, bien éclairée et cadrée.')}catch(e){scanMessage('Impossible de lire cette photo : '+e.message)}finally{if(url)URL.revokeObjectURL(url)}}
function wireScan(){document.getElementById('scanStart').onclick=startScan;document.getElementById('scanStop').onclick=()=>{stopScan();scanMessage('Caméra arrêtée.')};document.getElementById('scanFind').onclick=()=>resolveCode(document.getElementById('scanCode').value);document.getElementById('scanCode').onkeydown=e=>{if(e.key==='Enter')resolveCode(e.currentTarget.value)};document.getElementById('scanImage').onchange=e=>scanImage(e.currentTarget.files[0]);}
document.getElementById('closePlan').onclick=closePlan;document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlan()});document.querySelectorAll('nav [data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));(async()=>{try{dataset=await dbGet()}catch(e){importError='Stockage local indisponible : '+e.message}render()})();
</script><script>if ('serviceWorker' in navigator && location.protocol === 'https:') {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Mode hors ligne indisponible',err)));}</script></body></html>
