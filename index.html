<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StageFlow Mobile — Prototype 2B PWA</title><meta name="theme-color" content="#1a2430"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="StageFlow"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{color-scheme:dark;--bg:#151b24;--panel:#25303e;--panel2:#303d4d;--text:#f5f6f8;--muted:#acb9c9;--gold:#e8b85d;--line:#405062}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:2;background:#1a2430;padding:calc(18px + env(safe-area-inset-top, 0px)) 18px 14px;border-bottom:1px solid var(--line)}header small{color:var(--gold);font-weight:800;letter-spacing:2px}header h1{font-size:21px;margin:4px 0 0}main{max-width:640px;margin:auto;padding:18px 16px 110px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px}.muted{color:var(--muted)}.tiny{font-size:12px}.gold{color:var(--gold)}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.metric strong{display:block;font-size:28px}.metric span{font-size:12px;color:var(--muted)}.action,.item{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:14px;text-align:left;margin:6px 0}.action:focus-visible,.item:focus-visible,nav button:focus-visible{outline:3px solid var(--gold)}.item strong{display:block}.item small{color:var(--muted)}.pill{display:inline-block;border:1px solid #746239;background:#493c28;color:#f6d995;border-radius:30px;font-size:11px;padding:3px 9px}.search{width:100%;padding:14px;border:1px solid #647487;background:#202a37;color:white;border-radius:12px;margin-bottom:12px}details{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin:10px 0;overflow:hidden}summary{padding:15px;cursor:pointer;font-weight:700;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:'⌄';float:right;color:var(--gold)}details[open] summary:after{content:'⌃'}.rows{padding:0 15px 13px}.kv{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding:10px 0;font-size:13px}.kv span{color:var(--muted)}.kv b{text-align:right;overflow-wrap:anywhere}.back{border:0;background:transparent;color:var(--gold);padding:0 0 12px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);background:#1a2430;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:4}nav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;font-size:11px}nav button.active{color:var(--gold);font-weight:800}nav button span{display:block;font-size:20px}#demo{background:#48391f;border:1px solid #8a6b36;color:#ffe6af;padding:10px 13px;border-radius:10px;margin-bottom:15px;font-size:12px}.empty{padding:25px 10px;text-align:center;color:var(--muted)}
 .photo{max-width:100%;max-height:260px;object-fit:contain;border-radius:10px;margin-top:8px}.status{font-size:12px;color:var(--gold)}.danger{border-color:#a86767}.wide{width:100%}.reservation{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 0}.reservation>div{min-width:0}.mini{flex-shrink:0;border:1px solid var(--gold);border-radius:9px;color:var(--gold);background:transparent;padding:8px;font-size:12px}nav button{font-size:10px}nav button span{font-size:19px} </style></head><body><header><small>STAGEFLOW MOBILE</small><h1 id="heading">Mon parc technique</h1></header><main><div id="demo">PROTOTYPE 2B · Import manuel JSON · Lecture seule · Données conservées localement</div><div id="content"></div></main><nav aria-label="Navigation principale"><button data-page="home" class="active"><span>⌂</span>Accueil</button><button data-page="equipment"><span>▣</span>Matériel</button><button data-page="accessories"><span>◇</span>Accessoires</button><button data-page="events"><span>▤</span>Prestations</button><button data-page="search"><span>⌕</span>Recherche</button><button data-page="import"><span>⇩</span>Import</button></nav><script>
'use strict';
const demoEquipment=[{ref:'MAT-0012',name:'Lyre Spot LED 150 W',category:'Lyre asservie',state:'Disponible',location:'Stock A',technical:{Puissance:'150 W',Protocole:'DMX 512'}},{ref:'ACC-0001',name:'Câble DMX 5 m',category:'Câblage',state:'Disponible',location:'Stock A',technical:{Longueur:'5 m'}}];
const demoEvents=[{name:'Spectacle de magie — démonstration',date:'2026-12-12',place:'Salle fictive'}];
let dataset=null, page='home',selection=null,query='',importError='';
const content=document.getElementById('content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=x=>x===null||x===undefined||x===''?'—':String(x);
const fmtDate=x=>{if(!x)return '—';let d=new Date(String(x).slice(0,10)+'T12:00:00');return Number.isNaN(d.getTime())?String(x):d.toLocaleDateString('fr-FR')};
const arr=x=>Array.isArray(x)?x:[];
function rows(a){return a.map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b>${esc(val(v))}</b></div>`).join('')}
function section(name,body,open=false){return `<details ${open?'open':''}><summary>${esc(name)}</summary><div class="rows">${body||'<p class="muted tiny">Aucune information enregistrée.</p>'}</div></details>`}
function records(){if(!dataset)return {equipment:demoEquipment,events:demoEvents};let equipment=[];for(const i of dataset.items){const cat=dataset.categories.find(c=>c.id===i.categoryId)?.name||'Matériel';const units=arr(i.units);if(units.length){for(const u of units)equipment.push({ref:u.code||'Sans référence',name:i.name,category:cat,state:u.status||u.condition||'',location:u.location||i.location||'',technical:{Marque:i.brand,Modèle:i.model,'Référence fabricant':i.reference,'Numéro de série':u.serial},item:i,unit:u,type:'mat'});}else equipment.push({ref:i.reference||'Sans référence',name:i.name,category:cat,state:'',location:i.location||'',technical:{Marque:i.brand,Modèle:i.model},item:i,type:'mat'});}for(const a of dataset.accessories)equipment.push({ref:a.code||'Sans référence',name:a.name,category:a.category||'Accessoire',state:'',location:'',technical:{'Quantité en stock':a.qty},accessory:a,type:'acc'});return {equipment,events:dataset.shows};}
function go(p,id=null){page=p;selection=id;render();window.scrollTo(0,0)}
function itemList(list){return list.length?list.map((x,i)=>`<button class="item" data-item="${x.idx??i}"><strong>${esc(x.name)}</strong><small>${esc(x.ref)} · ${esc(x.category)}</small></button>`).join(''):'<div class="empty">Aucun résultat.</div>'}
function eventList(list){return list.length?list.map((x,i)=>`<button class="item" data-event="${i}"><strong>${esc(x.name)}</strong><small>${esc(fmtDate(x.start||x.startDate||x.date))} · ${esc(x.place||'')}</small></button>`).join(''):'<div class="empty">Aucune prestation.</div>'}
function showItem(x){let html=`<button class="back" data-back="${x.type==='acc'?'accessories':'equipment'}">← Retour</button><div class="panel"><div class="tiny gold">${esc(x.ref)}</div><h2>${esc(x.name)}</h2><span class="pill">${esc(x.category)}</span></div>`;html+=section('Identification',rows([['Référence',x.ref],['Catégorie',x.category],['Emplacement',x.location],['État',x.state]]),true);html+=section('Caractéristiques',rows(Object.entries(x.technical).filter(([k,v])=>v!==undefined&&v!=='')));if(x.item){let i=x.item;html+=section('Fiche commune',rows([['Description',i.description],['Quantité totale',i.qty],['Date d’acquisition',i.date],['Fournisseur',i.supplier]]));if(arr(i.photos).length)html+=section('Photographies',arr(i.photos).map(src=>typeof src==='string'&&src.startsWith('data:image/')?`<img class="photo" alt="Photographie du matériel" src="${esc(src)}">`:'').join(''));if(x.unit){let u=x.unit;html+=section('Suivi individuel',rows([['Numéro de série',u.serial],['Ancienne référence',u.legacyCode],['Emplacement',u.location],['État',u.status||u.condition]]));}}if(x.accessory)html+=section('Accessoire',rows([['Quantité',x.accessory.qty],['Notes',x.accessory.notes]]));return html}
function showEvent(x){
 const units=arr(x.units), lines=arr(x.accessoryLines);
 const {equipment}=records();
 const matRows=units.map(r=>{
  const idx=equipment.findIndex(e=>e.type==='mat'&&(e.unit?.id===r.unitId||(r.code&&e.ref===r.code)));
  const item=idx>=0?equipment[idx]:null;
  return `<div class="reservation"><div><strong>${esc(item?.name||r.name||'Appareil non retrouvé')}</strong><div class="tiny muted">${esc(item?.ref||r.code||'Sans référence')}</div><div class="tiny muted">Chargé : ${r.loaded?'Oui':'Non'} · Retourné : ${r.returned?'Oui':'Non'}</div></div>${idx>=0?`<button class="mini" data-linked-item="${idx}">Voir fiche</button>`:'<span class="tiny muted">Fiche indisponible</span>'}</div>`;
 }).join('');
 const accRows=lines.map(l=>{
  const idx=equipment.findIndex(e=>e.type==='acc'&&e.accessory?.id===l.accessoryId);
  const a=idx>=0?equipment[idx]:null;
  return `<div class="reservation"><div><strong>${esc(a?.name||l.name||'Accessoire non retrouvé')}</strong><div class="tiny muted">${esc(a?.ref||'Référence non disponible')} · Quantité : ${esc(l.qty??0)}</div><div class="tiny muted">Chargé : ${l.loaded?'Oui':'Non'} · Retourné : ${l.returned?'Oui':'Non'}</div></div>${idx>=0?`<button class="mini" data-linked-item="${idx}">Voir fiche</button>`:'<span class="tiny muted">Fiche indisponible</span>'}</div>`;
 }).join('');
 return `<button class="back" data-back="events">← Retour</button><div class="panel"><h2>${esc(x.name)}</h2><span class="pill">${esc(x.status||'Prestation')}</span></div>`+
 section('Informations',rows([['Début',fmtDate(x.start||x.startDate||x.date)],['Fin',fmtDate(x.end||x.endDate)],['Lieu',x.place],['Contact',x.contact],['Heure de rendez-vous',x.callTime],['Notes',x.notes]]),true)+
 section(`Appareils réservés (${units.length})`,matRows||'<p class="muted tiny">Aucun appareil réservé.</p>',true)+
 section(`Accessoires réservés (${lines.length})`,accRows||'<p class="muted tiny">Aucun accessoire réservé.</p>',true)+
 (x.accessories?section('Consommables à prévoir',`<p>${esc(x.accessories)}</p>`):'');
}
function render(){const {equipment,events}=records();let html='';document.getElementById('heading').textContent=selection?'Fiche de consultation':({home:'Mon parc technique',equipment:'Matériel',accessories:'Accessoires',events:'Prestations',search:'Recherche',import:'Import des données'}[page]);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('demo').textContent=dataset?'DONNÉES IMPORTÉES · Lecture seule · Aucun transfert vers Internet':'MODE DÉMONSTRATION · Données fictives · Lecture seule';
if(selection){html=selection.kind==='item'?showItem(equipment[selection.index]):showEvent(events[selection.index]);}
else if(page==='home'){html=`<div class="panel"><h2>${dataset?'Inventaire importé':'Bienvenue sur StageFlow Mobile'}</h2><p class="muted tiny">${dataset?'Consultation locale, sans modification possible.':'Données fictives : importer une sauvegarde JSON pour consulter votre parc.'}</p></div><div class="grid"><div class="metric"><strong>${equipment.filter(x=>x.type!=='acc').length}</strong><span>Unités matériel</span></div><div class="metric"><strong>${equipment.filter(x=>x.type==='acc').length}</strong><span>Accessoires</span></div><div class="metric"><strong>${events.length}</strong><span>Prestations</span></div><div class="metric"><strong>${dataset?arr(dataset.items).reduce((n,x)=>n+arr(x.photos).length,0):0}</strong><span>Photos</span></div></div><h2 style="margin-top:22px">Accès rapides</h2><button class="action" data-page="import">⇩ Importer une sauvegarde StageFlow PC</button><button class="action" data-page="equipment">▣ Consulter le matériel</button><button class="action" data-page="accessories">◇ Consulter les accessoires</button><button class="action" data-page="events">▤ Voir les prestations</button><div class="panel"><b>Dernière importation</b><p class="muted tiny">${dataset?esc(dataset.importedOn):'Aucune'}</p></div>`}
else if(page==='equipment'){html='<p class="muted tiny">Fiches consultables uniquement</p>'+itemList(equipment.map((x,i)=>({...x,idx:i})).filter(x=>x.type!=='acc'))}
else if(page==='accessories'){html='<p class="muted tiny">Accessoires · Fiches consultables uniquement</p>'+itemList(equipment.map((x,i)=>({...x,idx:i})).filter(x=>x.type==='acc'))}
else if(page==='events'){html='<p class="muted tiny">Prestations consultables uniquement</p>'+eventList(events)}
else if(page==='search'){let filtered=equipment.map((x,i)=>({...x,idx:i})).filter(x=>(x.ref+' '+x.name+' '+x.category+' '+x.location).toLowerCase().includes(query.toLowerCase()));html=`<label for="q" class="tiny gold">Référence MAT / ACC, nom ou catégorie</label><input id="q" class="search" type="search" placeholder="Ex. MAT-0012" value="${esc(query)}"><div id="results">${filtered.length?filtered.map(x=>`<button class="item" data-item="${x.idx}"><strong>${esc(x.name)}</strong><small>${esc(x.ref)}</small></button>`).join(''):'<div class="empty">Aucun résultat.</div>'}</div>`}
else if(page==='import'){html=`<div class="panel"><h2>Importer depuis StageFlow PC</h2><p class="muted">Sur le PC : <b>Sauvegardes → Télécharger une sauvegarde JSON</b>. Transfère ensuite ce fichier sur l’iPhone (AirDrop, Fichiers, etc.), puis sélectionne-le ici.</p><input id="jsonfile" type="file" accept=".json,application/json" style="width:100%;margin:12px 0"><p class="tiny muted">L’import remplace uniquement les données consultées sur cet iPhone. Il ne modifie jamais StageFlow PC et n’envoie rien à GitHub.</p>${dataset?`<p class="status">Dernier import : ${esc(dataset.importedOn)}</p><button class="action danger" id="clear">Effacer les données importées sur cet appareil</button>`:''}${importError?`<p class="status">${esc(importError)}</p>`:''}</div>`}
content.innerHTML=html;content.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>go('equipment',{kind:'item',index:Number(b.dataset.item)}));content.querySelectorAll('[data-linked-item]').forEach(b=>b.onclick=()=>go('equipment',{kind:'item',index:Number(b.dataset.linkedItem)}));content.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>go('events',{kind:'event',index:Number(b.dataset.event)}));content.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));content.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go(b.dataset.back));const inp=document.getElementById('q');if(inp)inp.oninput=()=>{query=inp.value;render();document.getElementById('q')?.focus();document.getElementById('q')?.setSelectionRange(query.length,query.length)};const file=document.getElementById('jsonfile');if(file)file.onchange=async()=>{if(file.files[0])await importFile(file.files[0])};const clear=document.getElementById('clear');if(clear)clear.onclick=async()=>{if(confirm('Effacer uniquement les données importées sur cet iPhone ?')){await dbPut(null);dataset=null;go('home')}};}
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open('StageFlowMobileReadOnly',1);r.onupgradeneeded=()=>r.result.createObjectStore('snapshots');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPut(value){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readwrite');tx.objectStore('snapshots').put(value,'current');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function dbGet(){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readonly');const r=tx.objectStore('snapshots').get('current');r.onsuccess=()=>{db.close();resolve(r.result)};r.onerror=()=>{db.close();reject(r.error)}})}
async function importFile(file){importError='';try{const data=JSON.parse(await file.text());if(data.application!=='Light Inventory'||data.formatVersion!==1||!Array.isArray(data.items)||!Array.isArray(data.categories)||!Array.isArray(data.shows)||!Array.isArray(data.accessories))throw Error('Fichier non reconnu : utilise une sauvegarde JSON complète de StageFlow PC.');if(!data.items.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string')||!data.accessories.every(x=>x&&typeof x.name==='string'))throw Error('Fichier incomplet ou invalide.');const snapshot={items:data.items,categories:data.categories,shows:data.shows,accessories:data.accessories,venues:arr(data.venues),importedOn:new Date().toLocaleString('fr-FR')};await dbPut(snapshot);dataset=snapshot;alert('Import terminé : '+data.items.length+' fiches matériel, '+data.accessories.length+' accessoires et '+data.shows.length+' prestations.');go('home')}catch(err){importError='Import impossible : '+err.message;render()}}
document.querySelectorAll('nav [data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));(async()=>{try{dataset=await dbGet()}catch(e){importError='Stockage local indisponible : '+e.message}render()})();
</script><script>if ('serviceWorker' in navigator && location.protocol === 'https:') {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Mode hors ligne indisponible',err)));}</script></body></html>
